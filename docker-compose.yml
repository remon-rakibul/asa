services:
  postgres:
    # pgvector build of Postgres 16 — required for the RAG vector store
    # (RAG_BACKEND=pgvector). Data volume is compatible with postgres:16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointments}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Set POSTGRES_PASSWORD in your environment / .env — do not ship a default to prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema is managed by Alembic (backend runs `alembic upgrade head` on start),
    # so no schema.sql init mount — Alembic is the single source of truth.
    # Host port is parameterized so the stack can run next to a host Postgres
    # (set POSTGRES_PORT=5433 in .env for dev-coexistence).
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appointments}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Containerized Ollama — opt-in profile. The default setup reuses an Ollama
  # already running on the host (DOCKER_OLLAMA_URL=http://host.docker.internal:11434
  # in .env), which avoids a second multi-GB model download and — under Docker
  # Desktop — the VM memory cap that a large model won't fit in. Only enable
  # this service on hosts with no local Ollama:
  #   docker compose --profile local-llm up -d
  # (and set DOCKER_OLLAMA_URL=http://ollama:11434 in .env so the backend
  # and voice worker target it).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      # OLLAMA_NUM_PARALLEL=1 lets Ollama reuse the prompt-prefix KV cache
      # across turns of the same conversation — without it every turn pays a
      # full re-prefill of the system prompt + history (measured ~70s vs
      # ~2-4s on a warm thread). OLLAMA_NUM_THREAD should be set to the host's
      # physical core count minus 2-4 (reserved for API/TTS/STT/voice
      # processes) via OLLAMA_NUM_THREAD in .env — omit it here since it's
      # host-specific; see docs/SCALING.md.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
    # Pull the model on first start. Remove this entrypoint after the first run.
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull ${OLLAMA_MODEL:-gemma4:latest} &&
             wait"
    restart: unless-stopped

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-appointments}
      # Default: the Ollama running on the HOST machine (see the ollama
      # service comment above). If you enable the containerized ollama via
      # --profile local-llm instead, set DOCKER_OLLAMA_URL=http://ollama:11434.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      # Production defaults (override in .env). The connection budget must hold:
      #   WEB_CONCURRENCY × 2 × DB_POOL_MAX ≤ Postgres max_connections (100)
      # The defaults below are 4 × 2 × 10 = 80 — safe on stock Postgres. Raise
      # WEB_CONCURRENCY toward your core count and lower DB_POOL_MAX to match.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Multi-worker rate limiting is shared through the bundled redis service.
      # Fails open to a per-worker in-process limiter if redis is unreachable.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Apply migrations before serving. WEB_CONCURRENCY sets the uvicorn worker
    # count (see the connection-budget note above and docs/SCALING.md).
    command: sh -c "alembic upgrade head && uvicorn api.app:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-4}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Shared rate limiting across backend workers/replicas. Multi-worker is the
  # production default (WEB_CONCURRENCY=4), so this runs by default. To drop
  # back to a single worker with the in-process limiter, set WEB_CONCURRENCY=1
  # and REDIS_URL= (empty) in .env.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Voice worker (LiveKit agent for browser voice calls + SIP telephony).
  # Opt-in profile — the image is large (CPU torch + Whisper + neural TTS)
  # and needs LIVEKIT_* credentials in .env. Start with:
  #   docker compose --profile voice up -d voice
  voice:
    build:
      context: .
      dockerfile: Dockerfile.voice
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-appointments}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Whisper/TTS weights download here on first start — persist them.
      - voice_models:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["voice"]

  ui:
    build:
      context: ./appointment-ui
      args:
        # Baked into the client bundle at BUILD time. Must be the URL the
        # PATIENT'S BROWSER can reach — in production your public API domain
        # (rebuild the ui image whenever this changes).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  voice_models:
